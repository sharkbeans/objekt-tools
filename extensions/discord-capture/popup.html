<!doctype html><html lang="en"><meta charset="utf-8"><title>objekt.my capture</title>
<style>body{font:14px system-ui;width:300px;padding:16px;color:#eee;background:#18181b}button,input,textarea{box-sizing:border-box;width:100%;margin:6px 0;padding:8px}a{color:#a5b4fc}#status{white-space:pre-wrap}</style>
<h1>Discord capture</h1><p>Enable on a trade channel, then browse normally. Posts stay in this browser.</p>
<button type="button" id="toggle">Enable / pause this channel</button><p id="status" role="status">Loading…</p>
<button type="button" id="dump">Dump index (.json)</button><button type="button" id="clear">Clear captured posts</button>
<button type="button" id="export">Export transcript (.txt)</button><p><a href="https://objekt.my/match" target="_blank" rel="noreferrer">Open objekt.my/match</a> → Import text files</p>
<hr><h2>Your haves</h2><p id="inventory-status" role="status"></p>
<label for="nickname">Cosmo nickname</label><input id="nickname" autocomplete="off" maxlength="30"><button type="button" id="load-inventory">Load inventory</button>
<label for="haves">Or type haves (replaces saved inventory)</label><textarea id="haves" placeholder="YooYeon CC101"></textarea><button type="button" id="save-haves">Save typed haves</button>
<script src="popup.js"></script></html>
